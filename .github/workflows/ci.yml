name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # 纯规则引擎：不装任何第三方包，证明解析 / 匹配 / 告警逻辑零依赖可测
  test-stdlib:
    name: unittest (py${{ matrix.python-version }}, no deps)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Byte-compile
        run: python -m compileall -q backend/app tests conftest.py

      - name: Unit tests (stdlib only)
        run: python -m unittest discover -s tests -t . -v

  # 完整依赖：pydantic 层 + FastAPI 接口测试
  test-full:
    name: pytest (py${{ matrix.python-version }}, full deps)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Unit tests (with pydantic, no skips)
        run: python -m unittest discover -s tests -t .

      - name: API tests (FastAPI TestClient)
        run: python -m pytest backend/tests -q

  lint:
    name: ruff
    runs-on: ubuntu-latest
    continue-on-error: true      # 存量代码尚未完全 lint-clean，仅作提示
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: ruff (advisory)
        run: ruff check backend tests conftest.py --output-format=github || true
