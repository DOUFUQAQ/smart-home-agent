<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780">
  <defs>
    <style>
      .title{font:700 30px "Microsoft YaHei",Arial,sans-serif;fill:#172033}
      .box-title{font:700 18px "Microsoft YaHei",Arial,sans-serif;fill:#172033}
      .text{font:15px "Microsoft YaHei",Arial,sans-serif;fill:#26364d}
      .small{font:13px "Microsoft YaHei",Arial,sans-serif;fill:#43536a}
      .pin{font:700 14px Consolas,monospace;fill:#0f172a}
      .box{fill:#ffffff;stroke:#26364d;stroke-width:2;rx:8}
      .esp{fill:#eef7ff;stroke:#1f6fb2;stroke-width:3;rx:10}
      .sensor{fill:#f0fdf4;stroke:#238636;stroke-width:2;rx:8}
      .act{fill:#fff7ed;stroke:#c2410c;stroke-width:2;rx:8}
      .power{fill:#fef2f2;stroke:#b91c1c;stroke-width:2;rx:8}
      .voice{fill:#f8fafc;stroke:#64748b;stroke-width:2;rx:8}
      .wire-signal{stroke:#2563eb;stroke-width:3;fill:none}
      .wire-gnd{stroke:#111827;stroke-width:3;fill:none;stroke-dasharray:8 6}
      .wire-power5{stroke:#ef4444;stroke-width:3;fill:none}
      .wire-power12{stroke:#dc2626;stroke-width:5;fill:none}
      .arrow{marker-end:url(#arrow)}
      .label-bg{fill:#fff;stroke:none}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="1200" height="780" fill="#f6f8fb"/>
  <text x="48" y="52" class="title">ESP32 智能家居总体接线图</text>
  <text x="50" y="82" class="small">低压控制侧必须共地；12V 负载只通过继电器触点接入，不能进入 ESP32 GPIO。</text>

  <rect x="470" y="150" width="260" height="430" class="esp"/>
  <text x="540" y="188" class="box-title">ESP32 DevKitC</text>
  <text x="500" y="235" class="pin">GPIO4</text>
  <text x="500" y="278" class="pin">GPIO34</text>
  <text x="500" y="321" class="pin">GPIO26</text>
  <text x="500" y="364" class="pin">GPIO27</text>
  <text x="500" y="407" class="pin">GPIO18</text>
  <text x="500" y="450" class="pin">GPIO19</text>
  <text x="500" y="493" class="pin">GPIO25</text>
  <text x="500" y="536" class="pin">GPIO2</text>
  <text x="628" y="235" class="pin">3V3</text>
  <text x="628" y="278" class="pin">5V/VIN</text>
  <text x="628" y="321" class="pin">GND</text>

  <rect x="70" y="145" width="250" height="100" class="sensor"/>
  <text x="100" y="178" class="box-title">DHT22 温湿度</text>
  <text x="100" y="207" class="text">DATA -> GPIO4</text>
  <text x="100" y="229" class="small">VCC -> 3V3，GND -> GND</text>

  <rect x="70" y="295" width="250" height="118" class="sensor"/>
  <text x="100" y="328" class="box-title">MQ-2 可燃气体</text>
  <text x="100" y="357" class="text">AO -> 分压 -> GPIO34</text>
  <text x="100" y="379" class="small">VCC -> 5V/VIN，GND -> GND</text>
  <text x="100" y="401" class="small">AO 不能超过 3.3V</text>

  <rect x="70" y="465" width="250" height="105" class="sensor"/>
  <text x="100" y="498" class="box-title">本地交互元件</text>
  <text x="100" y="527" class="text">轻触开关1 -> GPIO18/GND</text>
  <text x="100" y="549" class="text">轻触开关2 -> GPIO19/GND</text>

  <rect x="825" y="145" width="280" height="155" class="act"/>
  <text x="865" y="178" class="box-title">2 路 5V 光耦继电器</text>
  <text x="855" y="208" class="text">IN1 -> GPIO26</text>
  <text x="855" y="232" class="text">IN2 -> GPIO27</text>
  <text x="855" y="256" class="small">VCC -> 5V/VIN，GND -> GND</text>
  <text x="855" y="280" class="small">常见模块为低电平触发</text>

  <rect x="825" y="360" width="280" height="112" class="act"/>
  <text x="865" y="393" class="box-title">声光提示</text>
  <text x="855" y="423" class="text">蜂鸣器 SIG -> GPIO25</text>
  <text x="855" y="447" class="text">裸 LED 长脚 -> 电阻 -> GPIO2</text>

  <rect x="825" y="535" width="280" height="118" class="power"/>
  <text x="860" y="568" class="box-title">12V 负载电源</text>
  <text x="855" y="598" class="text">12V 2A 适配器</text>
  <text x="855" y="622" class="small">给两脚风扇供电</text>
  <text x="855" y="646" class="small">通过继电器 COM/NO 开关</text>

  <rect x="70" y="625" width="250" height="95" class="voice"/>
  <text x="105" y="658" class="box-title">语音输入输出</text>
  <text x="100" y="688" class="text">USB 麦克风 -> 电脑</text>
  <text x="100" y="712" class="text">小音箱 -> 电脑</text>

  <path class="wire-signal arrow" d="M320 195 C390 195 390 235 470 235"/>
  <path class="wire-signal arrow" d="M320 354 C390 354 390 278 470 278"/>
  <path class="wire-signal arrow" d="M730 321 C780 321 780 208 825 208"/>
  <path class="wire-signal arrow" d="M730 364 C780 364 780 232 825 232"/>
  <path class="wire-signal arrow" d="M320 520 C390 520 390 407 470 407"/>
  <path class="wire-signal arrow" d="M320 545 C390 545 390 450 470 450"/>
  <path class="wire-signal arrow" d="M730 493 C780 493 780 423 825 423"/>
  <path class="wire-signal arrow" d="M730 536 C780 536 780 447 825 447"/>

  <path class="wire-power5" d="M705 278 C770 278 770 256 825 256"/>
  <path class="wire-power5" d="M320 375 C395 375 395 278 628 278"/>
  <path class="wire-gnd" d="M705 321 C760 321 760 270 825 270"/>
  <path class="wire-gnd" d="M320 395 C395 395 395 321 628 321"/>
  <path class="wire-gnd" d="M320 230 C390 230 390 321 628 321"/>

  <path class="wire-power12" d="M965 535 C965 475 965 370 965 300"/>
  <text x="980" y="330" class="small">12V 只到继电器触点侧</text>

  <rect x="452" y="640" width="295" height="58" fill="#fff" stroke="#94a3b8" stroke-width="1.5" rx="8"/>
  <text x="478" y="665" class="text">推荐调试顺序：低压侧 -> 继电器 -> 12V 负载</text>
  <text x="478" y="688" class="small">每一步上电前用万用表确认正负极和共地。</text>
</svg>
